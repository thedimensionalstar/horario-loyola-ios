<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="fonts/fonts.css">
<!-- native.js lo genera "npm run build": expone los plugins de Capacitor (avisos, barra de estado, almacenamiento). -->
<script src="native.js"></script>
<title>Horario Loyola</title>
<meta name="description" content="Tu horario de clases: consulta el día, la semana y la próxima clase.">
<meta name="theme-color" content="#1c2945">
<style>
/* Layout: phone-first single column (max 600px). From 1000px wide it becomes timetable + sticky calendar rail.
   Concept: an animation timeline — every class is a clip on a track and "now" is the red playhead. */
:root{
  --ground:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#141c2e; --ink-2:#4b5770; --ink-3:#7d879c;
  --line:#dde3ec; --line-2:#c9d1de;
  --hero:#1c2945; --hero-2:#26365a; --hero-ink:#f4f6fb; --hero-dim:#a9b5cd; --hero-line:#3a4c73;
  --playhead:#e5383b; --on-playhead:#ffffff; --sel:#1c2945; --on-sel:#f4f6fb;
  --hol-bg:#fdecd3; --hol-fg:#94560a; --exam-bg:#e2e9fd; --exam-fg:#2d4fb8; --ok:#1f7a4f; --danger:#c42b2f;
  --alg-bg:#e4ebff; --alg-fg:#2f55ad; --alg-dot:#4d74d6;
  --mat-bg:#efe6fb; --mat-fg:#6f41a2; --mat-dot:#8e5fcb;
  --fis-bg:#dcf2e8; --fis-fg:#1d7254; --fis-dot:#2f9a72;
  --mod-bg:#fdebd7; --mod-fg:#8f4f17; --mod-dot:#d0802f;
  --nar-bg:#fbe2eb; --nar-fg:#a03a5f; --nar-dot:#d0567f;
  --pro-bg:#d9f0f6; --pro-fg:#1b6983; --pro-dot:#2f95b5;
  --shadow:0 1px 2px rgb(20 28 46 / .06), 0 10px 28px -16px rgb(20 28 46 / .28);
  --backdrop:rgb(10 15 28 / .5); --thumb:#ffffff;
  --f-display:"Bricolage Grotesque Variable","Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree Variable","Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono Variable","JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --sat:0px; --sticky-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0d121c; --surface:#151c2a; --surface-2:#1b2334; --ink:#e7ebf3; --ink-2:#a9b2c5; --ink-3:#7a849b;
  --line:#253045; --line-2:#334059;
  --hero:#172139; --hero-2:#22304f; --hero-ink:#f1f4fa; --hero-dim:#9aa7c2; --hero-line:#33456b;
  --playhead:#ff5a5f; --on-playhead:#1a0507; --sel:#dfe6f5; --on-sel:#101626;
  --hol-bg:#3a2a12; --hol-fg:#f4b860; --exam-bg:#1c2a52; --exam-fg:#a3b9ff; --ok:#5fd29a; --danger:#ff7b7e;
  --alg-bg:#1b2747; --alg-fg:#adc2ff; --alg-dot:#6f93f0;
  --mat-bg:#2a1f40; --mat-fg:#d4b6f6; --mat-dot:#a77ddc;
  --fis-bg:#132d25; --fis-fg:#8adbb9; --fis-dot:#3fb488;
  --mod-bg:#33241a; --mod-fg:#f6bf90; --mod-dot:#e0914a;
  --nar-bg:#361c28; --nar-fg:#f6a8c5; --nar-dot:#e06a93;
  --pro-bg:#12303a; --pro-fg:#8ad6ea; --pro-dot:#3fb0d0;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 12px 30px -18px rgb(0 0 0 / .7);
  --backdrop:rgb(0 0 0 / .62);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0d121c; --surface:#151c2a; --surface-2:#1b2334; --ink:#e7ebf3; --ink-2:#a9b2c5; --ink-3:#7a849b;
  --line:#253045; --line-2:#334059;
  --hero:#172139; --hero-2:#22304f; --hero-ink:#f1f4fa; --hero-dim:#9aa7c2; --hero-line:#33456b;
  --playhead:#ff5a5f; --on-playhead:#1a0507; --sel:#dfe6f5; --on-sel:#101626;
  --hol-bg:#3a2a12; --hol-fg:#f4b860; --exam-bg:#1c2a52; --exam-fg:#a3b9ff; --ok:#5fd29a; --danger:#ff7b7e;
  --alg-bg:#1b2747; --alg-fg:#adc2ff; --alg-dot:#6f93f0;
  --mat-bg:#2a1f40; --mat-fg:#d4b6f6; --mat-dot:#a77ddc;
  --fis-bg:#132d25; --fis-fg:#8adbb9; --fis-dot:#3fb488;
  --mod-bg:#33241a; --mod-fg:#f6bf90; --mod-dot:#e0914a;
  --nar-bg:#361c28; --nar-fg:#f6a8c5; --nar-dot:#e06a93;
  --pro-bg:#12303a; --pro-fg:#8ad6ea; --pro-dot:#3fb0d0;
  --shadow:0 1px 2px rgb(0 0 0 / .35), 0 12px 30px -18px rgb(0 0 0 / .7);
  --backdrop:rgb(0 0 0 / .62);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--alg-dot);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:600px;margin:0 auto;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:640px){.app{padding-top:14px}}
.app>*{min-width:0}
.main,.side{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0;align-content:start}
.main>*,.head-sheet>*{min-width:0}
.side{display:none}
@media (min-width:1000px){
  .app{max-width:1240px;grid-template-columns:minmax(0,1fr) 390px;align-items:start;column-gap:22px;padding-block:22px 56px}
  .side{display:grid;position:sticky;top:calc(var(--sticky-top) + 16px)}
  .tabbar{display:none!important}
  .toolbar{display:flex!important}
}

/* Top bar */
.topbar{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none;border-radius:12px;display:block}
.brand{flex:1;min-width:0}
.brand h1{font-size:21px;font-weight:750;line-height:1.1}
.brand p{font-size:12.5px;color:var(--hero-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:999px;font-weight:650;font-size:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.btn.ghost{box-shadow:none;background:transparent}
.btn.small{height:32px;padding:0 12px;font-size:13px}
.btn.on-hero{background:var(--hero-2);color:var(--hero-ink);border-color:var(--hero-line);box-shadow:none}

/* Hero: now / next */
.statusbar-shim{position:fixed;top:0;left:0;right:0;height:var(--sat);background:var(--hero);z-index:60;pointer-events:none}
.head-sheet{background:var(--hero);color:var(--hero-ink);margin-inline:-16px;padding:calc(var(--sat) + 12px) 16px 18px;border-radius:0 0 28px 28px;display:grid;gap:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.head-sheet::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 100% 0%,var(--hero-2),transparent 62%);pointer-events:none}
.head-sheet>*{position:relative}
@media (min-width:640px){.head-sheet{margin-inline:0;border-radius:var(--r-lg);padding:16px 18px 18px;border:1px solid var(--hero-line)}}
.hero{display:grid;gap:14px}
.hero-top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between}
.hero-main{min-width:0;display:grid;gap:6px}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--hero-dim)}
.eyebrow .live-dot{width:8px;height:8px;border-radius:50%;background:var(--playhead);box-shadow:0 0 0 4px color-mix(in srgb,var(--playhead) 28%,transparent);animation:pulse 1.8s ease-in-out infinite}
.today-chip{letter-spacing:.02em;text-transform:none;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero h2{font-size:clamp(21px,5.4vw,27px);font-weight:750;line-height:1.12}
.hero-detail{color:var(--hero-dim);font-size:14px;display:flex;flex-wrap:wrap;gap:4px 12px}
.hero-detail .mono{color:var(--hero-ink);font-size:13px}
.count{flex:none;text-align:right;display:grid;gap:1px;min-width:92px}
.count .k{font-size:11px;color:var(--hero-dim);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.count b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.05;letter-spacing:-.02em;white-space:nowrap}
.count span:last-child{font-size:12.5px;color:var(--hero-dim)}
.progress{height:6px;border-radius:999px;background:var(--hero-line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--playhead);border-radius:inherit;transition:width .6s ease}
.ruler{display:grid;gap:5px}
.ruler-label{font-size:11px;color:var(--hero-dim);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.ruler-track{position:relative;height:26px;border-radius:8px;background:repeating-linear-gradient(to right,var(--hero-line) 0 1px,transparent 1px calc(100% / 12));border:1px solid var(--hero-line)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:5px;background:var(--c-dot);opacity:.95}
.clip.done{opacity:.4}
.ruler-now{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--playhead)}
.ruler-now::before{content:"";position:absolute;top:-3px;left:-4px;width:10px;height:7px;background:var(--playhead);clip-path:polygon(0 0,100% 0,50% 100%)}
.ruler-ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--hero-dim)}

/* Banners */
.banners{display:grid;gap:10px}
.banner{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r-md);font-size:14px;border:1px solid var(--line);background:var(--surface)}
.banner strong{font-weight:700}
.banner .grow{flex:1;min-width:0}
.banner.holiday{background:var(--hol-bg);border-color:transparent;color:var(--hol-fg)}
.banner.holiday .date{font-family:var(--f-mono);font-size:12.5px;font-weight:600;white-space:nowrap}
.banner.changes{align-items:flex-start;flex-wrap:wrap}
.banner.changes ul{margin:4px 0 0;padding-left:18px;color:var(--ink-2)}
.banner.changes .tag{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--exam-bg);color:var(--exam-fg);padding:3px 8px;border-radius:999px}
.banner.error{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.reminders{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;display:grid;gap:8px}
.reminders h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-family:var(--f-body);font-weight:700}
.rem-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:14px;text-align:left;width:100%}
.rem-when{font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.rem-when.soon{background:var(--playhead);color:var(--on-playhead)}
.rem-when.exam{background:var(--exam-bg);color:var(--exam-fg)}
.rem-row small{display:block;color:var(--ink-3);font-size:12.5px}

/* View switch */
.toolbar{display:none;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:1;max-width:420px}
.seg button{height:34px;border-radius:999px;font-weight:650;font-size:14px;color:var(--ink-2);padding:0 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Day strip */
.strip{display:grid;grid-template-columns:30px repeat(5,minmax(0,1fr)) 30px;gap:6px;align-items:stretch}
.arrow{border-radius:12px;color:var(--ink-3);font-size:22px;line-height:1;display:grid;place-items:center}
.arrow:hover{color:var(--ink);background:var(--surface)}
.arrow:disabled{opacity:.3;cursor:default}
.dbtn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:7px 2px 8px;display:grid;justify-items:center;gap:1px;min-width:0}
.dbtn .dn{font-size:12px;font-weight:650;color:var(--ink-3)}
.dbtn .dd{font-family:var(--f-display);font-size:20px;font-weight:750;line-height:1.1}
.dots{display:flex;gap:3px;height:6px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c-dot)}
.dots em{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--hol-fg);line-height:6px}
.dots em.x{color:var(--exam-fg)}
.dbtn[aria-current="date"] .dn{color:var(--playhead)}
.dbtn[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--on-sel)}
.dbtn[aria-pressed="true"] .dn{color:inherit;opacity:.72}
.dbtn[aria-pressed="true"][aria-current="date"] .dn{opacity:1}
.dbtn[aria-pressed="true"][aria-current="date"] .dn{color:var(--playhead)}
.week-label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;color:var(--ink-3)}
.week-label strong{color:var(--ink-2);font-weight:650}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;display:grid;gap:14px;box-shadow:var(--shadow);min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-head h2{font-size:21px;font-weight:750}
.panel-head h2 small{font-family:var(--f-body);font-weight:500;color:var(--ink-3);font-size:15px;margin-left:4px}
.meta{font-size:13px;color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;vertical-align:3px}
.pill.today{background:var(--playhead);color:var(--on-playhead);margin-left:6px}

/* Day timeline */
.timeline{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.slot{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:stretch}
.slot-time{display:grid;align-content:space-between;padding-block:14px 12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.slot-time b{font-size:15px;font-weight:700}
.slot-time span{font-size:12.5px;color:var(--ink-3)}
.card{background:var(--c-bg);border-radius:var(--r-md);padding:13px 14px 12px;display:grid;gap:7px;min-width:0;border:1px solid color-mix(in srgb,var(--c-fg) 16%,transparent);position:relative}
.card-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.code{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--c-fg);opacity:.85}
.tag{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface);color:var(--ink-2)}
.tag.now{background:var(--playhead);color:var(--on-playhead)}
.tag.warn{background:var(--hol-bg);color:var(--hol-fg)}
.tag.exam{background:var(--exam-fg);color:var(--surface)}
.card h3{font-size:16.5px;font-weight:700;color:var(--c-fg);line-height:1.2}
.room{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink-2)}
.room svg{flex:none;color:var(--c-fg)}
.room .mono{font-weight:600;color:var(--ink);font-size:13px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.add{font-size:12.5px;font-weight:700;color:var(--c-fg);padding:4px 9px;border-radius:8px;border:1px dashed color-mix(in srgb,var(--c-fg) 45%,transparent)}
.add:hover{background:var(--surface)}
.card .bar{height:4px;border-radius:999px;background:color-mix(in srgb,var(--c-fg) 18%,transparent);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--playhead)}
.slot.is-live .card{box-shadow:0 0 0 2px var(--playhead)}
.slot.is-live .slot-time b{color:var(--playhead)}
.slot.is-past{opacity:.55}
.gap{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);padding-left:68px}
.gap::before{content:"";width:2px;height:22px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--line-2) 0 3px,transparent 3px 6px)}
.nowline{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}
.nowline span{font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--playhead)}
.nowline div{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--playhead);font-weight:650}
.nowline div::before{content:"";flex:1;order:2;height:2px;background:var(--playhead);border-radius:2px}
.nowline div::after{content:"";order:0;width:9px;height:9px;border-radius:50%;background:var(--playhead)}
.off{border-radius:var(--r-md);padding:16px;display:grid;gap:4px;background:var(--surface-2);border:1px solid var(--line)}
.off h3{font-size:18px}
.off p{color:var(--ink-2);font-size:14px}
.off-holiday{background:var(--hol-bg);border-color:transparent;color:var(--hol-fg)}
.off-holiday p{color:var(--hol-fg)}
.off-exam{background:var(--exam-bg);border-color:transparent;color:var(--exam-fg)}
.off-exam p{color:var(--exam-fg)}
.notice{border:1.5px dashed var(--line-2);border-radius:var(--r-md);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.notice strong{color:var(--ink)}
.ev{border-radius:var(--r-md);padding:12px 14px;display:grid;gap:4px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.ev strong{font-weight:700}
.ev p{color:var(--ink-2);font-size:13px}
.ev-exam{background:var(--exam-bg);border-color:transparent}
.ev-exam strong{color:var(--exam-fg)}
.ev-holiday{background:var(--hol-bg);border-color:transparent}
.ev-holiday strong{color:var(--hol-fg)}
.ev-notice{background:transparent;border:1.5px dashed var(--line-2)}
.ev .linkish{justify-self:start;font-size:12.5px;font-weight:700;color:var(--exam-fg);margin-top:2px}
.empty{color:var(--ink-3);font-size:14px;text-align:center;padding:18px 8px}

/* Deliveries (tasks attached to classes) */
.deliveries{display:grid;gap:6px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;text-align:left;background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13.5px;border:1px solid var(--line)}
.dl .st{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.dl.soon .st{color:var(--playhead)}
.dl.done{opacity:.6}
.dl.done strong{text-decoration:line-through}
.dl strong{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .go{color:var(--ink-3);font-size:16px}
.dl.exam-dl .st{color:var(--exam-fg)}
.extra{display:grid;gap:8px}
.extra h3{font-size:13px;font-family:var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.group{background:var(--c-bg);border-radius:var(--r-md);padding:10px 12px;display:grid;gap:8px}
.group h4{margin:0;font-size:14px;color:var(--c-fg);font-family:var(--f-display)}

/* Week grid */
.wk-wrap{--ppm:.92px;overflow-x:auto;margin-inline:-4px;padding:0 4px 10px}
@media (min-width:700px){.wk-wrap{--ppm:1.08px}}
.wk{display:grid;grid-template-columns:34px repeat(5,minmax(48px,1fr));column-gap:5px;min-width:300px}
.wk-h{display:grid;justify-items:center;gap:0;padding:6px 0 8px;border-radius:12px;min-width:0}
.wk-h .dn{font-size:12px;font-weight:650;color:var(--ink-3)}
.wk-h .dd{font-family:var(--f-display);font-size:18px;font-weight:750}
.wk-h[aria-current="date"] .dn{color:var(--playhead)}
.wk-h:hover{background:var(--surface-2)}
.wk-axis,.wk-col{position:relative;height:calc(630 * var(--ppm))}
.wk-axis span{position:absolute;right:4px;transform:translateY(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.wk-axis span:first-child{transform:none}
.wk-col{border-radius:12px;background:repeating-linear-gradient(to bottom,transparent 0 calc(60 * var(--ppm) - 1px),var(--line) calc(60 * var(--ppm) - 1px) calc(60 * var(--ppm)));background-position:0 calc(30 * var(--ppm));background-color:var(--surface-2)}
.wk-col.today{background-color:color-mix(in srgb,var(--playhead) 6%,var(--surface-2))}
.blk{position:absolute;left:2px;right:2px;top:calc(var(--s) * var(--ppm) + 2px);height:calc(var(--d) * var(--ppm) - 4px);background:var(--c-bg);border-left:3px solid var(--c-dot);border-radius:8px;padding:5px 4px 4px 5px;display:grid;align-content:start;gap:2px;text-align:left;overflow:hidden;min-width:0}
.blk:hover{filter:brightness(.97)}
.blk b{font-size:12px;line-height:1.15;color:var(--c-fg);font-weight:750;overflow-wrap:anywhere}
.blk span{font-family:var(--f-mono);font-size:10px;color:var(--ink-2);overflow-wrap:anywhere}
.blk .t,.blk .n-long,.wk-sum .n-long-only{display:none}
.wk-sum b{font-weight:750;color:var(--ink)}
.blk .lab{display:none;font-style:normal}
@media (min-width:700px){.blk .t,.blk .n-long{display:block}.blk .lab{display:inline}.blk .n-code,.wk-sum b{display:none}.blk b{font-size:13px}.blk span{font-size:10.5px}.blk{padding:5px 6px}}
.blk.past{opacity:.5}
.blk.live{box-shadow:0 0 0 2px var(--playhead)}
.blk.exam-blk{background:repeating-linear-gradient(135deg,var(--exam-bg) 0 8px,var(--surface) 8px 16px);border-left-color:var(--exam-fg)}
.blk.exam-blk b{color:var(--exam-fg)}
.blk .flag{position:absolute;top:4px;right:4px;width:15px;height:15px;border-radius:50%;background:var(--hol-bg);color:var(--hol-fg);font-size:10px;font-weight:800;display:grid;place-items:center}
.wk-off{position:absolute;inset:6px 4px;border-radius:10px;display:grid;place-items:center;text-align:center;padding:8px;font-size:12px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg)}
.wk-off.holiday{background:var(--hol-bg);color:var(--hol-fg)}
.wk-off.exam{background:var(--exam-bg);color:var(--exam-fg)}
.wk-off.other{background:var(--surface);color:var(--ink-3);border:1px dashed var(--line-2)}
.wk-now{position:absolute;left:-2px;right:-2px;top:calc(var(--s) * var(--ppm));height:2px;background:var(--playhead);z-index:2;pointer-events:none}
.wk-now::before{content:"";position:absolute;left:-3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--playhead)}
.wk-sum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.wk-sum span{display:inline-flex;align-items:center;gap:6px}
.wk-sum i{width:9px;height:9px;border-radius:3px;background:var(--c-dot)}

/* Calendar */
.cal-nav{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;text-align:center}
.cal-nav h3{font-size:17px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding-bottom:2px}
.cd{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;padding:4px 2px 5px;font-size:14px;font-weight:650;position:relative;background:var(--surface);border:1px solid transparent;min-width:0}

.cd.k-exam{background:var(--exam-bg);color:var(--exam-fg)}
.cd.notice{border:1.5px dashed var(--line-2)}
.cd.is-today::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--playhead)}
.cd[aria-pressed="true"]{background:var(--sel);color:var(--on-sel);border-color:var(--sel)}
.mk{display:flex;gap:2px;height:5px}
.mk i{width:5px;height:5px;border-radius:50%;background:var(--c-dot)}
.mk i.done{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.sw-hol{background:var(--hol-bg);border:1px solid var(--hol-fg)}
.sw-exam{background:var(--exam-bg);border:1px solid var(--exam-fg)}
.sw-off{background:transparent;border:1px solid var(--line-2)}
.sw-notice{border:1.5px dashed var(--ink-3)}
.events{display:grid;gap:8px}
.events h3,.sub-h{font-size:13px;font-family:var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.degree{font-size:12.5px;color:var(--ink-3)}

/* Tasks panel */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;background:var(--surface-2)}
.task input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);margin:0}
.task .ti{min-width:0;display:grid;text-align:left}
.task .ti strong{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .ti small{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.done .ti strong{text-decoration:line-through;color:var(--ink-3)}
.task .acts{display:flex;gap:2px}
.icon-btn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.icon-btn.armed{width:auto;padding:0 8px;background:var(--danger);color:var(--surface);font-size:12px;font-weight:700}
.smark{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--c-bg);color:var(--c-fg);font-size:11px;font-weight:800;font-family:var(--f-mono)}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.store-note{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.store-note i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.store-note.local i{background:var(--hol-fg)}

/* Dialog */
dialog{border:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);width:min(460px,calc(100vw - 32px));max-height:calc(100dvh - 48px);overflow:auto;padding:20px;box-shadow:0 24px 60px -20px rgb(0 0 0 / .45)}
dialog::backdrop{background:var(--backdrop)}
.dlg{display:grid;gap:14px}
.dlg h2{font-size:22px}
.subj-line{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.field{display:grid;gap:5px;font-size:13px;font-weight:650;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:16px;font-weight:500;color:var(--ink)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.kind label{position:relative;display:grid;place-items:center;height:34px;border-radius:9px;font-weight:650;font-size:14px;color:var(--ink-2);cursor:pointer}
.kind input{position:absolute;opacity:0;pointer-events:none}

.kind label:has(input:focus-visible){outline:2px solid var(--alg-dot)}
.hint{font-size:12.5px;color:var(--ink-3);font-weight:500}
.form-error{color:var(--danger);font-size:13px;min-height:0}
.form-error:empty{display:none}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions .spacer{flex:1}
.btn.danger{color:var(--danger);box-shadow:none}
.btn.danger.armed{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.detail-list{display:grid;gap:6px;font-size:14px}
.detail-list div{display:flex;gap:10px}
.detail-list dt{color:var(--ink-3);min-width:70px}
.detail-list dd{margin:0;font-weight:600}
.notes{white-space:pre-wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink-2)}
.status-pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.status-pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}

footer{display:grid;gap:8px;font-size:12.5px;color:var(--ink-3);padding-top:4px}
footer details summary{cursor:pointer;font-weight:650;color:var(--ink-2)}
footer details p{margin-top:6px;max-width:60ch}

/* Tab bar (iPhone) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border-top:1px solid var(--line)}

.tgroup h3 span{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:0}

const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const DSHORT=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function clock(date=new Date()){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',weekday:'long',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(date).map(x=>[x.type,x.value]));return {day:['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].indexOf(p.weekday),min:Number(p.hour)*60+Number(p.minute)}}
const fmt=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const dur=m=>m<60?`${m} min`:`${Math.floor(m/60)} h${m%60?' '+(m%60)+' min':''}`;
function todayKey(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Madrid',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function addDays(key,n){const d=new Date(key+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dayIndex(key){return (new Date(key+'T12:00:00Z').getUTCDay()+6)%7}
function dayNum(key){return Number(key.slice(8,10))}
function shortDate(key){return new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(key+'T12:00:00Z')).replace('.','')}
function longDate(key){return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}).format(new Date(key+'T12:00:00Z'))}
function monthOf(key){return (Number(key.slice(0,4))-2026)*12+Number(key.slice(5,7))-9}
const clampMonth=i=>Math.max(0,Math.min(11,i));
function matches(e,key){return key>=e.start&&key<=(e.end||e.start)}
function dateStatus(key){
 const exams=personalExams.filter(e=>e.start===key);
 if(exams.length)return {kind:'exam',title:exams.length===1?'Examen':exams.length+' exámenes',detail:exams.map(e=>e.time+' · '+e.name+' ('+e.session+')').join(' / ')+'. No tienes clase.',blocked:true};
 const event=academicCalendar.holidays.find(e=>matches(e,key)&&!e.pending);
 if(event)return {kind:'holiday',title:event.name,detail:'No hay clases.',blocked:true};
 if(key<'2026-09-01'||key>'2027-08-31')return {kind:'unknown',title:'Fuera del calendario 2026–2027',detail:'No hay calendario verificado para esta fecha.',blocked:true};
 if(key>'2027-06-26')return {kind:'holiday',title:'Vacaciones de verano',detail:'No tienes clases ni exámenes programados.',blocked:true};
 if(key<'2026-09-07')return {kind:'break',title:'Fuera del periodo de clases',detail:'No hay clases ordinarias de grado según este calendario.',blocked:true};
 if((key>'2026-12-04'&&key<'2027-02-01')||key>'2027-05-14')return {kind:'holiday',title:'Vacaciones / sin examen',detail:'No tienes clases ni exámenes programados para este día.',blocked:true};
 if(dayIndex(key)>4)return {kind:'weekend',title:'Fin de semana',detail:'No tienes clases en tu horario.',blocked:true};
 if(key>='2027-02-01')return {kind:'term2',title:'Segundo cuatrimestre',detail:'Hay periodo lectivo, pero falta añadir tu horario del segundo cuatrimestre.',blocked:true};
 return {kind:'class',title:'Día lectivo',detail:'',blocked:false};
}

const LOCAL_KEY='horario-loyola:tareas';
const Store={
 mode:'loading', tasks:[], error:'', col:null,
 async init(){
  if(!(window.claude&&typeof window.claude.use==='function')){this.useLocal();return}
  try{
   const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
   const uid=user?await user.id():null;
   if(!db||!uid){this.useLocal();return}
   this.col=db.doc('data/users/'+uid+'/horario').collection('tasks');
   this.mode='db';
   this.col.onSnapshot(snap=>{this.tasks=snap.docs.map(d=>({...d.data(),id:d.id}));this.error='';render()},
     ()=>{this.error='No se pudieron cargar tus tareas. Recarga la página para volver a intentarlo.';render()});
  }catch{this.useLocal()}
 },
 useLocal(){this.mode='local';try{this.tasks=JSON.parse(lsGet(LOCAL_KEY)||'[]')}catch{this.tasks=[]}render();
  if(NATIVE&&NATIVE.Preferences){
   NATIVE.Preferences.get({key:LOCAL_KEY}).then(r=>{
    let saved=null;try{saved=r&&r.value?JSON.parse(r.value):null}catch{}
    if(Array.isArray(saved)){this.tasks=saved;lsSet(LOCAL_KEY,r.value);render()}else if(this.tasks.length)this.persist();
    queueReminders();
   }).catch(()=>{});
  }
 },
 persist(){const v=JSON.stringify(this.tasks);lsSet(LOCAL_KEY,v);if(NATIVE&&NATIVE.Preferences)NATIVE.Preferences.set({key:LOCAL_KEY,value:v}).catch(()=>{});queueReminders()},
 msg(e){const c=e&&e.code;return c==='quota_exceeded'?'Se ha llenado el espacio para tareas. Borra alguna antigua y vuelve a intentarlo.':c==='invalid_argument'?'No tienes permiso para guardar tareas en esta página.':'No se pudo guardar. Revisa tu conexión y vuelve a intentarlo.'},
 async save(task){
  const {id,...body}=task;body.updatedAt=new Date().toISOString();
  if(this.mode==='db'){const ref=id?this.col.doc(id):this.col.doc();await ref.set(body);return ref.id}
  const nid=id||('t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
  const i=this.tasks.findIndex(t=>t.id===nid);const t={...body,id:nid};
  if(i>=0)this.tasks[i]=t;else this.tasks.push(t);this.persist();render();return nid;
 },
 async setDone(task,done){
  if(this.mode==='db'){await this.col.doc(task.id).update({done,updatedAt:new Date().toISOString()});return}
  return this.save({...task,done});
 },
 async remove(id){
  if(this.mode==='db'){await this.col.doc(id).delete();return}
  this.tasks=this.tasks.filter(t=>t.id!==id);this.persist();render();
 }
};
const tasksAll=()=>[...Store.tasks].sort((a,b)=>a.due.localeCompare(b.due)||Number(a.done)-Number(b.done)||a.title.localeCompare(b.title,'es'));
function tasksForDate(key,subject){return tasksAll().filter(t=>t.kind!=='exam'&&t.due===key&&(subject===undefined||t.subject===subject))}
function appExamsFor(key,subject){return Store.tasks.filter(t=>t.kind==='exam'&&t.due===key&&t.subject===subject)}
function allExams(){return [...personalExams.map(e=>({...e,kind:'exam'})),...Store.tasks.filter(t=>t.kind==='exam').map(t=>({id:t.id,name:(SUBJECTS[t.subject]?SUBJECTS[t.subject].name+' · ':'')+t.title,start:t.due,time:t.time||'Hora por confirmar',room:t.room,session:'Personal',kind:'exam'}))]}

/* ───────────── Próxima clase ───────────── */
function findNext(){
 const now=clock(),key=todayKey();
 for(let offset=0;offset<200;offset++){
  const target=addDays(key,offset);if(dateStatus(target).blocked)continue;
  const found=SCHEDULE[dayIndex(target)].find(c=>!appExamsFor(target,c.subject).length&&(offset>0||c.end>now.min));
  if(found)return {c:found,offset,key:target};
 }
 return null;
}
function ruler(key,label){
 const list=dateStatus(key).blocked?[]:SCHEDULE[dayIndex(key)],now=clock(),isToday=key===todayKey();
 const pct=m=>((Math.max(480,Math.min(1200,m))-480)/720*100).toFixed(2);
 const clips=list.filter(c=>!appExamsFor(key,c.subject).length).map(c=>`<span class="clip ${isToday&&now.min>=c.end?'done':''}" style="${vars(c.subject)};left:${pct(c.start)}%;width:${(pct(c.end)-pct(c.start)).toFixed(2)}%" title="${esc(SUBJECTS[c.subject].short)} ${fmt(c.start)}–${fmt(c.end)}"></span>`).join('');
 const head=isToday&&now.min>=480&&now.min<=1200?`<span class="ruler-now" style="left:${pct(now.min)}%"></span>`:'';
 return `<div class="ruler" aria-hidden="true"><span class="ruler-label">${esc(label)}</span><div class="ruler-track">${clips}${head}</div><div class="ruler-ticks">${[8,10,12,14,16,18,20].map(h=>`<span>${String(h).padStart(2,'0')}</span>`).join('')}</div></div>`;
}

 }

 const when=offset===0?'Hoy':offset===1?'Mañana':`${DAYS[dayIndex(n.key)]} ${shortDate(n.key)}`;
 let count;
 if(live)count=`<span class="k">Termina en</span><b>${dur(c.end-now.min)}</b><span>a las ${fmt(c.end)}</span>`;
 else if(offset===0)count=`<span class="k">Empieza en</span><b>${dur(c.start-now.min)}</b><span>a las ${fmt(c.start)}</span>`;

 else count=`<span class="k">Empieza el</span><b>${DSHORT[dayIndex(n.key)]} ${dayNum(n.key)}</b><span>a las ${fmt(c.start)}</span>`;
 const chip=st.blocked?`<span class="today-chip">Hoy · ${esc(st.title)}</span>`:'';

 const progress=live?`<div class="progress" role="progressbar" aria-label="Progreso de la clase" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((now.min-c.start)/(c.end-c.start)*100)}"><i style="width:${((now.min-c.start)/(c.end-c.start)*100).toFixed(1)}%"></i></div>`:'';
 el.innerHTML=`<div class="hero-top"><div class="hero-main"><p class="eyebrow">${live?'<span class="live-dot"></span>En clase ahora':'Próxima clase'}${chip}</p><h2>${esc(s.name)}</h2><p class="hero-detail"><span class="mono">${when} · ${fmt(c.start)}–${fmt(c.end)}</span><span>${esc(roomFull(c))}</span></p>${tags?`<div class="card-top">${tags}</div>`:''}</div><div class="count">${count}</div></div>${progress}${ruler(n.key,offset===0?'Tu día':when)}`;
}

 let items='',prevEnd=null,nowPlaced=!isToday||st.blocked;
 const nowLine=label=>`<li class="nowline" aria-label="Ahora"><span>${fmt(now.min)}</span><div>${label}</div></li>`;
 list.forEach((c,i)=>{

const REM_KEY='horario-loyola:avisos';
let remStatus='',remTimer=null;
function remPrefs(){try{return {on:false,min:10,...JSON.parse(lsGet(REM_KEY)||'{}')}}catch{return {on:false,min:10}}}
function saveRemPrefs(p){const v=JSON.stringify(p);lsSet(REM_KEY,v);if(NATIVE&&NATIVE.Preferences)NATIVE.Preferences.set({key:REM_KEY,value:v}).catch(()=>{})}
function madridDate(key,min){
 const [y,m,d]=key.split('-').map(Number),h=Math.floor(min/60),mm=min%60,wall=Date.UTC(y,m-1,d,h,mm);
 const off=t=>{const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Madrid',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date(t)).map(x=>[x.type,x.value]));return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute)-t};
 let t=wall;for(let i=0;i<2;i++)t=wall-off(t);return new Date(t);
}
function setRemStatus(text){remStatus=text;const el=document.getElementById('rem-status');if(el)el.textContent=text}
function queueReminders(){if(!NATIVE)return;clearTimeout(remTimer);remTimer=setTimeout(scheduleReminders,1200)}
async function scheduleReminders(){
 if(!NATIVE||!NATIVE.LocalNotifications)return;
 const LN=NATIVE.LocalNotifications,p=remPrefs();
 try{
  const pending=await LN.getPending();
  if(pending.notifications.length)await LN.cancel({notifications:pending.notifications.map(n=>({id:n.id}))});
  if(!p.on){setRemStatus('Avisos desactivados.');return}
  const perm=await LN.checkPermissions();
  if(perm.display!=='granted'){setRemStatus('La app no tiene permiso para avisarte. Actívalo en Ajustes › Notificaciones › Horario.');return}
  const list=[],now=Date.now(),today=todayKey();
  for(let d=0;d<21&&list.length<60;d++){
   const key=addDays(today,d);if(dateStatus(key).blocked)continue;
   SCHEDULE[dayIndex(key)].forEach((c,i)=>{
    if(appExamsFor(key,c.subject).length)return;
    const at=madridDate(key,c.start-p.min);if(at.getTime()<now+30000)return;
    const s=SUBJECTS[c.subject];
    list.push({id:100000+d*100+i,title:`${s.short} en ${p.min} min`,body:`${fmt(c.start)}–${fmt(c.end)} · ${roomFull(c)}`,schedule:{at,allowWhileIdle:true}});
   });
  }
  if(list.length)await LN.schedule({notifications:list.slice(0,60)});
  setRemStatus(list.length?`Tienes ${list.length} avisos programados para las próximas 3 semanas. Abre la app de vez en cuando para que se renueven.`:'No hay clases en las próximas 3 semanas.');
 }catch(e){setRemStatus('No se pudieron programar los avisos.')}
}
function remindersPanel(){
 if(!NATIVE)return '';
 const p=remPrefs();
 return `<section class="panel"><div class="panel-head"><h2>Avisos de clase</h2></div><label class="switch-row" for="rem-on"><span><strong>Avisarme antes de cada clase</strong><small>Con la hora y el aula de la clase.</small></span><input type="checkbox" id="rem-on" ${p.on?'checked':''}></label><label class="field" for="rem-min">Cuánto antes<select id="rem-min">${[5,10,15,30].map(m=>`<option value="${m}" ${p.min===m?'selected':''}>${m} minutos antes</option>`).join('')}</select></label><p class="hint" id="rem-status">${esc(remStatus)}</p></section>`;
}
document.addEventListener('change',async e=>{
 if(!NATIVE)return;
 if(e.target.id==='rem-on'){
  const p=remPrefs(),box=e.target;
  if(box.checked){
   let ok=false;try{const r=await NATIVE.LocalNotifications.requestPermissions();ok=r.display==='granted'}catch{}
   if(!ok){box.checked=false;saveRemPrefs({...p,on:false});setRemStatus('Sin permiso para avisarte. Actívalo en Ajustes › Notificaciones › Horario y vuelve a intentarlo.');return}
  }
  saveRemPrefs({...p,on:box.checked});scheduleReminders();
 }else if(e.target.id==='rem-min'){
  saveRemPrefs({...remPrefs(),min:Number(e.target.value)});scheduleReminders();
 }
});

 <label class="field" for="f-due">Fecha<input id="f-due" type="date" required value="${esc(task?.due||date)}"></label>
 <div id="f-exam" class="dlg" style="gap:10px" ${k==='exam'?'':'hidden'}><div class="row2"><label class="field" for="f-time">Hora<input type="time" id="f-time" value="${esc(task?.time||'')}"></label><label class="field" for="f-room">Aula<input id="f-room" maxlength="100" value="${esc(task?.room||'')}" placeholder="Ej.: A1.08"></label></div><p class="hint" id="f-hint"></p></div>
 <label class="field" for="f-notes">Notas <span class="hint">(opcional)</span><textarea id="f-notes" maxlength="1000" rows="3">${esc(task?.notes||'')}</textarea></label>
 <p class="form-error" id="f-error" role="alert"></p>
 <div class="actions">${task?'<button type="button" class="btn small danger" id="f-delete">Eliminar</button>':''}<span class="spacer"></span><button type="button" class="btn small ghost" id="f-cancel">Cancelar</button><button type="submit" class="btn small primary" id="f-save">Guardar</button></div></form>`;
 const $=id=>dlg.querySelector('#'+id),isExam=()=>$('f-kind-exam').checked;
 const applyDefaults=()=>{
  $('f-exam').hidden=!isExam();$('dlg-title').textContent=`${task?'Editar':'Añadir'} ${isExam()?'examen':'tarea'}`;
  if(!isExam()||task)return;
  const d=examDefaults($('f-due').value,$('f-subject').value||null);
  if(d){if(!$('f-subject').value)$('f-subject').value=d.subject;$('f-time').value=d.time;$('f-room').value=d.room;$('f-hint').textContent='Hora y aula de tu clase de esa asignatura ese día. Puedes cambiarlas. El examen sustituirá ese bloque en tu horario.'}
  else $('f-hint').textContent=$('f-subject').value?'No tienes clase de esta asignatura ese día. Indica hora y aula si las sabes.':'Elige la asignatura para rellenar su hora y aula.';
 };
 dlg.querySelectorAll('[name=kind]').forEach(r=>r.onchange=applyDefaults);
 $('f-due').onchange=applyDefaults;$('f-subject').onchange=applyDefaults;applyDefaults();
 $('f-cancel').onclick=()=>dlg.close();
 if(task){const del=$('f-delete');let armed=false,timer;del.onclick=async()=>{
  if(!armed){armed=true;del.classList.add('armed');del.textContent='¿Eliminar? Pulsa otra vez';timer=setTimeout(()=>{armed=false;del.classList.remove('armed');del.textContent='Eliminar'},4000);return}
  clearTimeout(timer);del.disabled=true;try{await Store.remove(task.id);dlg.close()}catch(e){$('f-error').textContent=Store.msg(e);del.disabled=false}}}
 $('task-form').onsubmit=async e=>{
  e.preventDefault();const title=$('f-title').value.trim(),due=$('f-due').value;
  if(!title){$('f-error').textContent='Escribe un título para la tarea.';$('f-title').focus();return}
  if(!due){$('f-error').textContent='Elige una fecha.';return}
  const exam=isExam(),payload={...(task?{id:task.id}:{}),kind:exam?'exam':'task',title,due,subject:$('f-subject').value||null,time:exam?($('f-time').value||null):null,room:exam?($('f-room').value.trim()||null):null,notes:$('f-notes').value.trim(),done:task?.done||false};
  $('f-save').disabled=true;
  try{await Store.save(payload);setSelected(due);dlg.close();render()}catch(err){$('f-error').textContent=Store.msg(err)}finally{$('f-save').disabled=false}
 };
 dlg.showModal();setTimeout(()=>$('f-title').focus(),30);
}
function openDetails(id){
 const t=Store.tasks.find(x=>x.id===id);if(!t)return;const s=SUBJECTS[t.subject];
 dlg.innerHTML=`<div class="dlg"><p class="subj-line"><span class="smark" style="${vars(t.subject)}">${t.kind==='exam'?'E':s?esc(s.code[0]):'T'}</span>${esc(s?.name||'Sin asignatura')}</p><h2 id="dlg-title">${esc(t.title)}</h2><dl class="detail-list" style="margin:0"><div><dt>${t.kind==='exam'?'Examen':'Entrega'}</dt><dd>${esc(longDate(t.due))}</dd></div>${t.kind==='exam'?`<div><dt>Hora</dt><dd>${esc(t.time||'Por confirmar')}</dd></div><div><dt>Aula</dt><dd>${esc(t.room||'Por confirmar')}</dd></div>`:''}<div><dt>Estado</dt><dd><span class="status-pill ${t.done?'ok':''}">${t.done?'Hecha':'Pendiente'}</span></dd></div></dl>${t.notes?`<p class="notes">${esc(t.notes)}</p>`:''}<p class="form-error" id="d-error" role="alert"></p><div class="actions"><button type="button" class="btn small ghost" id="d-close">Cerrar</button><span class="spacer"></span><button type="button" class="btn small" id="d-edit">Editar</button><button type="button" class="btn small primary" id="d-done">${t.done?'Marcar pendiente':'Marcar hecha'}</button></div></div>`;
 dlg.querySelector('#d-close').onclick=()=>dlg.close();
 dlg.querySelector('#d-edit').onclick=()=>{dlg.close();openForm(t)};
 dlg.querySelector('#d-done').onclick=async e=>{e.target.disabled=true;try{await Store.setDone(t,!t.done);dlg.close()}catch(err){dlg.querySelector('#d-error').textContent=Store.msg(err);e.target.disabled=false}};
 dlg.showModal();
}

/* ───────────── Interacción ───────────── */
function shiftDay(dir){let k=addDays(selectedKey,dir);while(dayIndex(k)>4)k=addDays(k,dir);setSelected(k)}
function step(dir){
 if(view==='tasks')return;
 if(view==='day')shiftDay(dir);
 else if(view==='week')setSelected(addDays(selectedKey,dir*7));
 else monthIndex=clampMonth(monthIndex+dir);
 render();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-task]');if(!t)return;
 if(t.id==='today-btn'){view='day';setSelected(todayKey());render();return}
 if(t.dataset.view){const changed=view!==t.dataset.view;view=t.dataset.view;render();if(changed&&t.closest('.tabbar'))window.scrollTo({top:0});return}
 if(t.hasAttribute('data-dismiss-install')){lsSet('horario-loyola:instalar','no');renderBanners();return}
 if(t.hasAttribute('data-install')){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.finally(()=>{installPrompt=null;renderBanners()})}return}
 if(t.hasAttribute('data-dismiss-changes')){lsSet(CHANGES_KEY,'ok');renderBanners();return}
 if(t.dataset.week){setSelected(addDays(selectedKey,Number(t.dataset.week)*7));render();return}
 if(t.dataset.month){monthIndex=clampMonth(monthIndex+Number(t.dataset.month));render();return}
 if(t.hasAttribute('data-add')){openForm(null,{date:t.dataset.due||selectedKey,subject:t.dataset.subject||null,kind:t.dataset.kind||'task'});return}
 if(t.dataset.task){openDetails(t.dataset.task);return}
 if(t.dataset.edit){const task=Store.tasks.find(x=>x.id===t.dataset.edit);if(task)openForm(task);return}
 if(t.dataset.delete){
  if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='¿Borrar?';setTimeout(()=>{if(t.isConnected){t.classList.remove('armed');t.textContent='×'}},4000);return}
  Store.remove(t.dataset.delete).catch(err=>{Store.error=Store.msg(err);render()});return;
 }
 if(t.dataset.date){
  setSelected(t.dataset.date);
  if(t.dataset.to==='day')view='day';
  render();
 }
});
document.addEventListener('change',e=>{
 const c=e.target.closest('[data-complete]');if(!c)return;
 const task=Store.tasks.find(x=>x.id===c.dataset.complete);if(!task)return;
 c.disabled=true;Store.setDone(task,c.checked).catch(err=>{Store.error=Store.msg(err);render()});
});
document.addEventListener('keydown',e=>{
 if(dlg.open||e.target.closest('input,select,textarea'))return;
 if(e.key==='ArrowRight'){step(1)}else if(e.key==='ArrowLeft'){step(-1)}
});
(()=>{let x0=null,y0=null;const v=document.getElementById('view');
 v.addEventListener('touchstart',e=>{if(e.touches.length===1){x0=e.touches[0].clientX;y0=e.touches[0].clientY}},{passive:true});
 v.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
  if(Math.abs(dx)>70&&Math.abs(dy)<45&&!e.target.closest('.wk-wrap'))step(dx<0?1:-1)},{passive:true});
})();

render();
Store.init();
setInterval(()=>{if(!dlg.open)render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();queueReminders()}});
if(NATIVE){
 try{NATIVE.StatusBar.setStyle({style:NATIVE.Style.Dark}).catch(()=>{})}catch{}
 if(NATIVE.Preferences)NATIVE.Preferences.get({key:REM_KEY}).then(r=>{if(r&&r.value)lsSet(REM_KEY,r.value);queueReminders()}).catch(()=>queueReminders());
}
if(typeof matchMedia==='function')matchMedia('(min-width: 1000px)').addEventListener('change',()=>render());
</script>
</body>
</html>
